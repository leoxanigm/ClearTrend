services:
  web:
    build:
      context: ./web
      target: dev
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - ./tests:/tests:ro
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: sh -c "npm run prisma:generate && npm run dev -- --hostname 0.0.0.0"

  analysis:
    volumes:
      - ./analysis:/app
    ports:
      - "8000:8000"
    # If launching for the first time, then it might take several minute for downloading the DBs
    command: sh -c "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

  db:
    expose:
      - "5432"
